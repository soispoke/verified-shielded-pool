name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# The pool commit these proofs verify. SPEC.md section 1 pins the same commit
# and its artifact hashes, and check_formal.py checks those hashes.
env:
  POOL_COMMIT: 8835be75681dd36bfceaf73bc8c7fbd2b2c4157a

jobs:
  formal:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Check out the pool at the verified commit
        uses: actions/checkout@v7
        with:
          repository: soispoke/minimal-shielded-pool
          ref: ${{ env.POOL_COMMIT }}
      - name: Check out this repository as formal/
        uses: actions/checkout@v7
        with:
          path: formal
      - name: Apply the pool tooling changes the proofs use
        run: git apply formal/pool-tooling.patch
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tooling/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Check the statement lock, artifact pins and Lean sources
        run: python formal/tools/check_formal.py all
      - name: Check the Lean R1CS and its symbols against the pinned artifact
        run: |
          npm ci --prefix tooling
          python -m pip install --requirement requirements.txt
          mkdir -p "$RUNNER_TEMP/circuit"
          tooling/node_modules/.bin/circom2 circuits/spend.circom \
            --r1cs --sym -l tooling/node_modules -o "$RUNNER_TEMP/circuit"
          cmp "$RUNNER_TEMP/circuit/spend.r1cs" build/spend.r1cs
          python formal/tools/r1cs_artifact.py --sym "$RUNNER_TEMP/circuit/spend.sym" \
            --check-lean formal/Artifacts/Spend.lean
          node formal/tools/crosscheck_r1cs.cjs tooling/node_modules build/spend.r1cs \
            formal/Artifacts/spend.manifest.json
          MSP_SPEND_SYM="$RUNNER_TEMP/circuit/spend.sym" \
            python -m unittest discover -s formal/tools -p 'test_*.py'
      - name: Check every generated Lean data file against the pinned artifacts
        run: |
          sym="$RUNNER_TEMP/circuit/spend.sym"
          for tool in path_bits_fragment path_gates sink_gates range_fragment \
                      range_address_fragment range_amounts beta_gates; do
            python "formal/tools/$tool.py" --sym "$sym"
          done
          for tool in compression_fragment small_hash_gates small_hash_affine \
                      constraint_coverage circuit_assembly_layout \
                      hash_assignment_completeness assignment_recovery \
                      groth16_key nonvacuity_poseidon; do
            python "formal/tools/$tool.py"
          done
          python formal/tools/hash_instances.py --node-modules tooling/node_modules --sym "$sym"
          python formal/tools/assignment_plan.py --node-modules tooling/node_modules --sym "$sym"
          python formal/Poseidon/generate.py --check
          python formal/Poseidon/optimized_generate.py --check
          python formal/Poseidon/small_optimized_generate.py --check
          python formal/Keccak/vector_generator.py --node-modules tooling/node_modules
          python -m unittest discover -s formal/Poseidon -p 'test_*.py'
          python -m unittest discover -s formal/Keccak -p 'test_*.py'
      - name: Install Lean
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch the Mathlib build cache
        working-directory: formal
        run: lake exe cache get
      - name: Build the proofs and audit their axioms
        working-directory: formal
        shell: bash
        run: |
          lake build 2>&1 | tee "$RUNNER_TEMP/lake-build.log"
          if grep -n 'declaration uses .sorry.' "$RUNNER_TEMP/lake-build.log"; then exit 1; fi
      - name: Differential-test the executable model against the wallet
        run: |
          python formal/tools/differential_model.py --seed 20260927 -n 100
          python -m unittest discover -s formal/tools -p 'test_differential_model.py'
