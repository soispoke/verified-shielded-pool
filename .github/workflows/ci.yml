name: Formal verification

# The proofs cover one pinned pool commit, so they run on changes to this
# repository, weekly and on demand, never on pool pushes. A manual run can check
# a candidate pool commit; check_formal.py then reports which pinned artifacts
# differ from SPEC.md section 1. Pushes and pull requests reuse the project
# build of an earlier run; the weekly run and manual runs by default rebuild
# every project module from source.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:
    inputs:
      pool_ref:
        description: Pool commit to check (defaults to the verified commit)
        required: false
        default: ""
      full_rebuild:
        description: Rebuild every project module from source, ignoring the build cache
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: formal-${{ github.ref }}
  cancel-in-progress: true

# The pool commit these proofs verify. SPEC.md section 1 pins the same commit
# and its artifact hashes, and check_formal.py checks those hashes.
env:
  POOL_COMMIT: 8835be75681dd36bfceaf73bc8c7fbd2b2c4157a

jobs:
  formal-artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out the pool at the verified commit
        uses: actions/checkout@v7
        with:
          repository: soispoke/minimal-shielded-pool
          ref: ${{ inputs.pool_ref || env.POOL_COMMIT }}
      - name: Check out this repository as formal/
        uses: actions/checkout@v7
        with:
          path: formal
      - name: Apply the pool tooling changes the proofs use
        run: git apply formal/pool-tooling.patch
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tooling/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Check the Lean R1CS and its symbols against the pinned artifact
        run: |
          npm ci --prefix tooling
          python -m pip install --requirement requirements.txt
          mkdir -p "$RUNNER_TEMP/circuit"
          tooling/node_modules/.bin/circom2 circuits/spend.circom \
            --r1cs --sym -l tooling/node_modules -o "$RUNNER_TEMP/circuit"
          cmp "$RUNNER_TEMP/circuit/spend.r1cs" build/spend.r1cs
          python formal/tools/r1cs_artifact.py --sym "$RUNNER_TEMP/circuit/spend.sym" \
            --check-lean formal/Artifacts/Spend.lean
          node formal/tools/crosscheck_r1cs.cjs tooling/node_modules build/spend.r1cs \
            formal/Artifacts/spend.manifest.json
          MSP_SPEND_SYM="$RUNNER_TEMP/circuit/spend.sym" \
            python -m unittest discover -s formal/tools -p 'test_*.py'
      - name: Check every generated Lean data file against the pinned artifacts
        run: |
          sym="$RUNNER_TEMP/circuit/spend.sym"
          for tool in path_bits_fragment path_gates sink_gates range_fragment \
                      range_address_fragment range_amounts beta_gates; do
            python "formal/tools/$tool.py" --sym "$sym"
          done
          for tool in compression_fragment small_hash_gates small_hash_affine \
                      constraint_coverage circuit_assembly_layout \
                      hash_assignment_completeness assignment_recovery \
                      groth16_key groth16_subgroups groth16_cofactor nonvacuity_poseidon; do
            python "formal/tools/$tool.py"
          done
          python formal/tools/hash_instances.py --node-modules tooling/node_modules --sym "$sym"
          python formal/tools/assignment_plan.py --node-modules tooling/node_modules --sym "$sym"
          python formal/Poseidon/generate.py --check
          python formal/Poseidon/optimized_generate.py --check
          python formal/Poseidon/small_optimized_generate.py --check
          python formal/Keccak/vector_generator.py --node-modules tooling/node_modules
          python formal/tools/dispatcher_pilot.py --check
          for case in membership range duplicate sink; do
            python formal/tools/mutation_certificates.py --case "$case"
          done
          python -m unittest discover -s formal/Poseidon -p 'test_*.py'
          python -m unittest discover -s formal/Keccak -p 'test_*.py'

  formal:
    # Only owner-reviewed code (check_formal.py, the owned pool patch, elan,
    # Lake and Mathlib's cache tool) runs before the proofs are built and
    # checked; the artifact tooling runs in `formal-artifacts`, on another runner.
    runs-on: ubuntu-latest
    # A from-scratch build of every project module; GitHub caps a job at 360.
    timeout-minutes: 355
    env:
      FULL_REBUILD: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.full_rebuild) }}
    steps:
      - name: Check out the pool at the verified commit
        uses: actions/checkout@v7
        with:
          repository: soispoke/minimal-shielded-pool
          ref: ${{ inputs.pool_ref || env.POOL_COMMIT }}
      - name: Check out this repository as formal/
        uses: actions/checkout@v7
        with:
          path: formal
      - name: Apply the pool tooling changes the proofs use
        run: git apply formal/pool-tooling.patch
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Check the statement lock, artifact pins and Lean sources
        run: python -I formal/tools/check_formal.py all
      - name: Free disk space for the Lean build
        run: |
          # The project, Mathlib and the toolchain need about 19 GB; drop
          # preinstalled toolchains this job does not use.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h / /mnt
      - name: Add swap for the heaviest modules
        run: |
          # Artifacts/Spend.lean peaks near 8 GB and each mutation chunk near
          # 3.6 GB; the runner has 16 GB. Swap absorbs a brief overlap.
          sudo fallocate -l 16G /mnt/lean-swap
          sudo chmod 600 /mnt/lean-swap
          sudo mkswap /mnt/lean-swap
          sudo swapon /mnt/lean-swap
          free -h
      - name: Install Lean
        run: |
          # Never build from a checked-in output; routine runs restore a CI cache below.
          rm -rf formal/.lake
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch the Mathlib build cache
        working-directory: formal
        run: lake exe cache get
      - name: Restore the project build of an earlier run
        if: env.FULL_REBUILD != 'true'
        uses: actions/cache/restore@v4
        with:
          path: formal/.lake/build
          key: lean-build-${{ hashFiles('formal/lean-toolchain', 'formal/lake-manifest.json') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: lean-build-${{ hashFiles('formal/lean-toolchain', 'formal/lake-manifest.json') }}-
      - name: Build the proofs and audit their axioms and types
        id: build
        # Stops early enough to save progress below, so the next run resumes.
        timeout-minutes: 320
        working-directory: formal
        shell: bash
        env:
          # At most three modules at once keeps peak memory within RAM and swap.
          LEAN_NUM_THREADS: "3"
        run: |
          lake build 2>&1 | tee "$RUNNER_TEMP/lake-build.log"
          if grep -n 'declaration uses .sorry.' "$RUNNER_TEMP/lake-build.log"; then exit 1; fi
      - name: Save the project build for later runs
        if: always() && (steps.build.outcome == 'success' || steps.build.outcome == 'failure')
        uses: actions/cache/save@v4
        with:
          path: formal/.lake/build
          key: lean-build-${{ hashFiles('formal/lean-toolchain', 'formal/lake-manifest.json') }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Recheck the audit, the lock and the sources after the build
        working-directory: formal
        run: |
          lake env lean Proofs/AxiomAudit.lean
          python -I tools/check_formal.py all
          git diff --exit-code
      - name: Differential-test the executable model against the wallet
        run: |
          python -m pip install --requirement requirements.txt
          python formal/tools/differential_model.py --seed 20260927 -n 100
          python -m unittest discover -s formal/tools -p 'test_differential_model.py'
